name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a 4K MOV file
        2. Add a mask with AI selection
        3. Export as MP4
  - type: input
    id: version
    attributes:
      label: NomadMovie version
      placeholder: "1.0.0"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows, Linux, Running from source]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or sample files
