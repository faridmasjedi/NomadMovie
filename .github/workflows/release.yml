name: Release

# Publish a new version in either of two ways:
#   • Actions tab → "Release" → Run workflow → enter a version such as 1.2.0
#   • or push a tag:  git tag v1.2.0 && git push origin v1.2.0
# Builds macOS (Apple Silicon + Intel), Windows and Linux (see build-app.yml), then creates a GitHub Release
# with the installers and plain zips.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 1.2.0)"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Work out the version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then v="${INPUT_VERSION#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' is not a version like 1.2.0"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Create the tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then echo "::error::Tag $TAG already exists"; exit 1; fi
          git tag "$TAG"
          git push origin "$TAG"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build-app.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.tag }}
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NomadMovie-*
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: NomadMovie ${{ needs.prepare.outputs.version }}
          prerelease: ${{ inputs.prerelease || contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true
          files: installers/*
          body: |
            ## Download

            | System | Installer | Or just unzip and run |
            | --- | --- | --- |
            | macOS, Apple Silicon (M1 and later) | `NomadMovie-${{ needs.prepare.outputs.version }}-mac-arm64.dmg` | `…-mac-arm64.zip` |
            | macOS, Intel | `NomadMovie-${{ needs.prepare.outputs.version }}-mac-x64.dmg` | `…-mac-x64.zip` |
            | Windows 10/11 | `NomadMovie-${{ needs.prepare.outputs.version }}-windows-setup.exe` | `…-win-x64.zip` |
            | Linux | `.AppImage` (any distro) or `.deb` (Ubuntu/Debian) | `…-linux-x64.zip` |

            **First launch on macOS:** if macOS says it can't check the app for malicious software, right-click NomadMovie in Applications → **Open** → **Open**. (Only needed once, and only for builds that aren't notarized by Apple.)
            **Windows:** if SmartScreen appears, click **More info → Run anyway**.
